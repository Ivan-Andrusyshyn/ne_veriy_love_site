<div class="view-toggle" role="group" aria-label="Вигляд списку категорій">
  <button
    type="button"
    class="view-toggle__btn"
    [class.is-active]="viewMode() === 'grid'"
    [attr.aria-pressed]="viewMode() === 'grid'"
    (click)="setViewMode('grid')"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path
        fill="currentColor"
        d="M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 0h7v7h-7v-7Z"
      />
    </svg>
    Сітка
  </button>

  <button
    type="button"
    class="view-toggle__btn"
    [class.is-active]="viewMode() === 'list'"
    [attr.aria-pressed]="viewMode() === 'list'"
    (click)="setViewMode('list')"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path
        fill="currentColor"
        d="M4 5h16v2H4V5Zm0 6h16v2H4v-2Zm0 6h16v2H4v-2Z"
      />
    </svg>
    Список
  </button>
</div>

<div
  class="categories-grid"
  [class.isSmallCard]="isSmallCard()"
  [class.is-list]="viewMode() === 'list'"
>
  @for (category of categories(); track category.slug) {
    <a
      class="category-card"
      [routerLink]="[category.slug]"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
    >
      <div class="category-card__media">
        <img [src]="category.imageUrl" [alt]="category.title" loading="lazy" />
      </div>
      <h3 class="category-card__title">{{ category.title }}</h3>
      <p class="category-card__desc">{{ category.description }}</p>
    </a>
  }
</div>
