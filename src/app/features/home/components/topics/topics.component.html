<section class="block topics" id="теми">
  <h2 class="section-title">Статті</h2>

  <div class="topics-grid">
    @for (topic of topics; track topic.title) {
      <article class="topic-card" [routerLink]="['/articles', topic.slug]">
        <img [src]="topic.image" [alt]="topic.alt" loading="lazy" />

        <h3>{{ topic.title }}</h3>

        <p>{{ topic.description }}</p>
      </article>
    }
  </div>
</section>
