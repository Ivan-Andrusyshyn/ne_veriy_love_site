@if (featured(); as article) {
  <section class="block featured" id="featured">
    <div class="featured-media">
      <img
        [src]="article.imageUrl"
        [alt]="article.title"
        width="800"
        height="600"
        loading="lazy"
        decoding="async"
      />
    </div>

    <div class="featured-copy">
      <p class="eyebrow-plain">Стаття тижня</p>

      <h2>{{ article.title }}</h2>

      <p class="featured-excerpt">
        {{ article.excerpt }}
      </p>

      <a
        class="link-arrow"
        [routerLink]="['/articles', article.categorySlug, article.articleSlug]"
      >
        Читати статтю повністю
        <span aria-hidden="true">→</span>
      </a>
    </div>
  </section>
}
