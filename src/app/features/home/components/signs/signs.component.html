<section class="block signs" id="ознаки">
  <div class="signs-inner">
    <h2 class="section-title light">Шість ознак здорової довіри</h2>

    <ol class="signs-list">
      @for (sign of signs; track sign.title; let i = $index) {
        <li>
          <span class="num">{{ (i + 1).toString().padStart(2, "0") }}</span>
          <div>
            <h3>{{ sign.title }}</h3>
            <p>{{ sign.description }}</p>
          </div>
        </li>
      }
    </ol>
  </div>
</section>
