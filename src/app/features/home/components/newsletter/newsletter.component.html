<section class="block newsletter" id="розсилка">

    <h2>Раз на тиждень — один чесний лист</h2>
    <p>
      Без спаму. Одна стаття, одна практика, одна думка, над якою варто
      подумати.
    </p>
    <form class="newsletter-form" onsubmit="return false;">

        placeholder="ваш email"
        aria-label="Електронна пошта"

      />
      <button type="submit" class="btn btn-primary">Підписатись</button>
    </form>
  </div>
</section>
